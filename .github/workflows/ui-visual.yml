name: UI Visual Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # commit visual evidence back to the repo

jobs:
  visual:
    name: Drive both apps through a full UI tour (5 tabs × 9 modes)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve last successful build run
        run: |
          RUN_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=1" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workflow_runs'][0]['id'])")
          echo "BUILD_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Using build run: $RUN_ID"

      - name: Download build artifact (cross-run)
        uses: actions/download-artifact@v4
        with:
          name: DiskDude-macos-26-app
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/

      - name: Stage + extract original app (absolute paths — Round 6 bug fix)
        run: |
          cp reference/DiskDude-1.0.1.dmg "$PWD/original.dmg"
          hdiutil attach "$PWD/original.dmg" -mountpoint /Volumes/DiskDudeOrig -quiet
          cp -R /Volumes/DiskDudeOrig/DiskDude.app "$PWD/original.app"
          hdiutil detach /Volumes/DiskDudeOrig -quiet
          # the built app must ALSO be an absolute path
          BUILT=$(find "$PWD/build" -name "DiskDude.app" -type d | head -1)
          echo "BUILT_APP=$BUILT" >> "$GITHUB_ENV"
          echo "ORIGINAL_APP=$PWD/original.app" >> "$GITHUB_ENV"
          ls -la "$BUILT/Contents/MacOS/"

      - name: "Build fixture tree (simulated files: types/formats/sizes/dates)"
        run: |
          python3 ci/make_fixtures.py "$PWD/fixture" --home "$HOME"
          echo "FIXTURE=$PWD/fixture" >> "$GITHUB_ENV"

      - name: Clear quarantine + ad-hoc sign both apps
        run: |
          codesign --force --deep --sign - "$BUILT_APP" || true
          codesign --force --deep --sign - "$ORIGINAL_APP" || true
          xattr -dr com.apple.quarantine "$BUILT_APP" "$ORIGINAL_APP" 2>/dev/null || true

      - name: Drive ORIGINAL app through the tour
        run: |
          set -o pipefail
          chmod +x ci/drive_ui.sh
          ./ci/drive_ui.sh "$ORIGINAL_APP" "$PWD/shots" "$FIXTURE" light original 2>&1 | tee original-tour.log

      - name: Drive REBUILT app through the tour
        run: |
          set -o pipefail
          ./ci/drive_ui.sh "$BUILT_APP" "$PWD/shots" "$FIXTURE" light rebuilt 2>&1 | tee rebuilt-tour.log

      - name: Fail loudly if either tour produced no captures
        run: |
          ORIG_N=$(ls shots 2>/dev/null | grep -c '^original-' || true)
          REB_N=$(ls shots 2>/dev/null | grep -c '^rebuilt-' || true)
          echo "original captures: $ORIG_N | rebuilt captures: $REB_N"
          if [ "$ORIG_N" -lt 5 ] || [ "$REB_N" -lt 5 ]; then
            echo "::error::tour incomplete (original=$ORIG_N rebuilt=$REB_N) — check the tour logs"
            exit 1
          fi

      - name: Per-state pixel diff + side-by-side montages
        run: |
          mkdir -p diffs sides
          if command -v magick >/dev/null; then IM=magick; else IM=convert; fi
          {
            echo "| State | AE (5% fuzz) | RMSE |"
            echo "|---|---|---|"
          } > diff-matrix.md
          for orig in shots/original-*.png; do
            state=$(basename "$orig" | sed 's/^original-//; s/\.png$//')
            reb="shots/rebuilt-${state}.png"
            [ -f "$reb" ] || { echo "MISSING pair for ${state}" >> diff-matrix.md; continue; }
            AE=$($IM compare -metric AE -fuzz 5% "$orig" "$reb" null: 2>&1 || true)
            RMSE=$($IM compare -metric RMSE "$orig" "$reb" null: 2>&1 || true)
            $IM compare -metric AE -fuzz 5% "$orig" "$reb" "diffs/${state}.png" 2>/dev/null || true
            $IM append "$orig" "$reb" -label "orig | rebuilt" "sides/${state}.png" 2>/dev/null \
              || $IM convert "$orig" "$reb" +append "sides/${state}.png" || true
            echo "| ${state} | ${AE} | ${RMSE} |" >> diff-matrix.md
          done
          cat diff-matrix.md | tee -a "$GITHUB_STEP_SUMMARY"
          # contact sheet of the rebuilt tour
          $IM montage shots/rebuilt-*.png -tile 4x -geometry 320x200+4+4 shots/rebuilt-contact-sheet.png 2>/dev/null || true

      - name: Record browsing videos (both apps)
        run: |
          chmod +x ci/record_video.sh
          ./ci/record_video.sh "$ORIGINAL_APP" "$PWD/original-tour.mov" "$FIXTURE" 20
          ./ci/record_video.sh "$BUILT_APP" "$PWD/rebuilt-tour.mov" "$FIXTURE" 20
          ls -la *.mov

      - name: Commit evidence to docs/visual-evidence (fixed filenames, no growth)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p docs/visual-evidence
          cp shots/*.png diffs/*.png sides/*.png docs/visual-evidence/ 2>/dev/null || true
          cp diff-matrix.md docs/visual-evidence/ 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add docs/visual-evidence || true
          if git diff --cached --quiet; then
            echo "no visual changes to commit"
          else
            git commit -m "Visual evidence: full UI tour (5 tabs x 9 modes) with fixture scan" || true
            git push || echo "push skipped (no permission or race)"
          fi

      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-artifacts
          path: |
            shots/
            diffs/
            sides/
            *.mov
            *.log
            diff-matrix.md
          retention-days: 30
          if-no-files-found: warn
