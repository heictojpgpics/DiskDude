name: UI Visual Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

jobs:
  visual:
    name: Launch both apps, capture screenshots, pixel-diff
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest build artifact
        uses: actions/download-artifact@v4
        with:
          name: DiskDude-macos-26-app
          path: build/
        continue-on-error: true

      - name: Download + extract original app
        run: |
          curl -fsSL -o original.dmg https://www.disk-dude.com/downloads/DiskDude-1.0.1.dmg
          hdiutil attach original.dmg -mountpoint /Volumes/DiskDudeOrig -quiet
          cp -R /Volumes/DiskDudeOrig/DiskDude.app original.app
          hdiutil detach /Volumes/DiskDudeOrig -quiet

      - name: Clear quarantine + prepare both apps
        run: |
          BUILT=build/Build/Products/Release/DiskDude.app
          [ -d "$BUILT" ] || BUILT=build/DiskDude.app
          echo "BUILT_APP=$BUILT" >> "$GITHUB_ENV"
          # ad-hoc sign so Gatekeeper lets us launch on the runner
          codesign --force --deep --sign - "$BUILT" || true
          codesign --force --deep --sign - original.app || true
          xattr -dr com.apple.quarantine "$BUILT" original.app 2>/dev/null || true

      - name: Capture screenshots (original app)
        run: |
          mkdir -p shots
          # Launch original in a deterministic state: window 1200x800 at origin
          open -W -n -a "$(pwd)/original.app" --args -WindowState 2>/dev/null || \
          open -n -a "$(pwd)/original.app" || true
          sleep 6
          osascript -e 'tell application "System Events" to set frontmost of process "DiskDude" to true' || true
          osascript <<'EOF' 2>/dev/null || true
          tell application "System Events"
            tell process "DiskDude"
              set size of window 1 to {1200, 800}
              set position of window 1 to {0, 0}
            end tell
          end tell
          EOF
          sleep 2
          screencapture -x -t png shots/original-main.png
          osascript -e 'quit app "DiskDude"' || pkill -x DiskDude || true
          sleep 2

      - name: Capture screenshots (rebuilt app)
        run: |
          open -n -a "$BUILT_APP" || true
          sleep 6
          osascript -e 'tell application "System Events" to set frontmost of process "DiskDude" to true' || true
          osascript <<'EOF' 2>/dev/null || true
          tell application "System Events"
            tell process "DiskDude"
              set size of window 1 to {1200, 800}
              set position of window 1 to {0, 0}
            end tell
          end tell
          EOF
          sleep 2
          screencapture -x -t png shots/rebuilt-main.png
          osascript -e 'quit app "DiskDude"' || pkill -x DiskDude || true

      - name: Pixel diff
        run: |
          if [ -f shots/original-main.png ] && [ -f shots/rebuilt-main.png ]; then
            # ImageMagick pixel comparison (perceptual + exact)
            sips -g pixelWidth -g pixelHeight shots/*.png || true
            if command -v magick >/dev/null; then IM=magick; else IM=convert; fi
            $IM compare -metric RMSE shots/original-main.png shots/rebuilt-main.png \
              shots/diff.png 2>&1 | tee rmse.txt || true
            $IM compare -metric AE -fuzz 5% shots/original-main.png shots/rebuilt-main.png \
              null: 2>&1 | tee ae.txt || true
            echo "### UI pixel diff" >> "$GITHUB_STEP_SUMMARY"
            echo "- RMSE: $(cat rmse.txt 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Pixels differing (5% fuzz): $(cat ae.txt 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Screenshots missing — check app launch logs"
            ls -la shots/ || true
          fi

      - name: Capture video of rebuilt app (10s)
        run: |
          # Screen recording via screencapture -v (available on macOS runners)
          open -n -a "$BUILT_APP" || true
          sleep 5
          timeout 10 screencapture -v shots/rebuilt-tour.mov || true
          pkill -x DiskDude || true
          ls -la shots/

      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-artifacts
          path: shots/
          retention-days: 30
          if-no-files-found: warn
