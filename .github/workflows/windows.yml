name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cross-platform/**"
      - ".github/workflows/windows.yml"
      - "ci/make_fixtures.py"

jobs:
  windows:
    name: "Windows: build DiskDudeCore + CLI, test, scan fixture"
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift toolchain (winget — the official swift.org package)
        shell: pwsh
        run: |
          if (Get-Command swift -ErrorAction SilentlyContinue) {
            swift --version; Write-Host "swift already present"; exit 0
          }
          # swift.org/install/windows documents:
          #   winget install --id Swift.Toolchain -e --source winget
          # (the direct WiX bundle exe no-ops on GH runners and
          #  setup-swift v2 has no Windows support at all)
          winget install --id Swift.Toolchain -e --source winget --silent `
            --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) {
            Write-Host "winget pinned install failed, trying latest"
            winget install --id Swift.Toolchain -e --source winget --silent `
              --accept-source-agreements --accept-package-agreements --version 6.4.0
          }
          winget list --id Swift.Toolchain --source winget
          if ($LASTEXITCODE -ne 0) { Write-Host "winget list failed (non-fatal)" }

      - name: Locate Swift and add to PATH
        shell: pwsh
        run: |
          if (Get-Command swift -ErrorAction SilentlyContinue) { swift --version; exit 0 }
          # winget installs per-user when the shell is non-elevated — search
          # machine AND user locations
          $roots = @(
            "C:\Program Files\Swift\Toolchains",
            "C:\Library\Developer\Toolchains",
            "C:\Library\Swift",
            "$env:LOCALAPPDATA\Programs\Swift\Toolchains",
            "$env:LOCALAPPDATA\Swift\Toolchains",
            "$env:LOCALAPPDATA\Swift"
          )
          $bin = $null
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $hit = Get-ChildItem $r -Recurse -Filter "swift.exe" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "usr\\bin" } | Select-Object -First 1
              if ($hit) { $bin = Split-Path $hit.FullName; Write-Host "toolchain at: $bin"; break }
            }
          }
          if (-not $bin) {
            foreach ($base in @("C:\Program Files", "$env:LOCALAPPDATA\Programs", "$env:USERPROFILE")) {
              $hit = Get-ChildItem $base -Recurse -Filter "swift.exe" -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($hit) { $bin = Split-Path $hit.FullName; Write-Host "toolchain (deep search) at: $bin"; break }
            }
          }
          if (-not $bin) { throw "swift.exe not found after winget install" }
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\swift.exe" --version

      - name: Build + test (VS dev environment)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\vsdevcmd.bat" -arch=x64
          cd cross-platform
          swift build -c release
          swift test

      - name: Generate fixtures + parity scan
        shell: pwsh
        run: |
          python ci/make_fixtures.py "$env:RUNNER_TEMP\fixture" --scale 0.25
          cross-platform\.build\release\diskdude-cli.exe "$env:RUNNER_TEMP\fixture" --top 10 --out report-windows.txt
          Get-Content report-windows.txt | Select-Object -First 30

      - name: Normalize report (root path -> ROOT)
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\fixture"
          $r = [System.IO.File]::ReadAllText("report-windows.txt")
          $r = $r.Replace($root, "ROOT").Replace("$env:RUNNER_TEMP/fixture", "ROOT")
          [System.IO.File]::WriteAllText("report-windows.txt", $r)

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-windows
          path: report-windows.txt

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: diskdude-cli-windows
          path: cross-platform/.build/release/diskdude-cli.exe

  linux:
    name: "Linux: build + test + reference report"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: |
          cd cross-platform
          swift build -c release
          swift test
      - name: Fixtures + scan
        run: |
          python3 ci/make_fixtures.py "$RUNNER_TEMP/fixture" --scale 0.25
          cross-platform/.build/release/diskdude-cli "$RUNNER_TEMP/fixture" --top 10 --out report-linux.txt
          head -30 report-linux.txt
      - name: Normalize report (root path -> ROOT)
        shell: bash
        run: |
          sed -i.bak "s|$RUNNER_TEMP/fixture|ROOT|g" report-linux.txt && rm -f report-linux.txt.bak
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report-linux
          path: report-linux.txt

  macos:
    name: "macOS: build + test + report (SwiftPM, no Xcode UI)"
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: |
          cd cross-platform
          swift build -c release
          swift test
      - name: Fixtures + scan
        run: |
          python3 ci/make_fixtures.py "$RUNNER_TEMP/fixture" --scale 0.25
          cross-platform/.build/release/diskdude-cli "$RUNNER_TEMP/fixture" --top 10 --out report-macos.txt
          head -30 report-macos.txt
      - name: Normalize report (root path -> ROOT)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os, pathlib
          t = os.environ["RUNNER_TEMP"] + "/fixture"
          p = pathlib.Path("report-macos.txt")
          s = p.read_text()
          p.write_text(s.replace(t, "ROOT"))
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report-macos
          path: report-macos.txt

  parity:
    name: "Parity: byte-identical reports across Windows/Linux/macOS"
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-report-*
          merge-multiple: false
          path: reports/
      - name: Diff the three reports
        run: |
          find reports -name "*.txt" | sort
          ok=1
          for a in reports/*/report-*.txt; do
            for b in reports/*/report-*.txt; do
              if [ "$a" \< "$b" ]; then
                if ! diff -u "$a" "$b"; then
                  echo "MISMATCH: $a vs $b"
                  ok=0
                fi
              fi
            done
          done
          if [ $ok -eq 1 ]; then
            echo "✓ All three platforms produced byte-identical scan reports"
          else
            exit 1
          fi
