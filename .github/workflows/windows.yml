name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cross-platform/**"
      - ".github/workflows/windows.yml"
      - "ci/make_fixtures.py"

jobs:
  windows:
    name: "Windows: build DiskDudeCore + CLI, test, scan fixture"
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"
        continue-on-error: true

      - name: Swift install (7z-extract the WiX bundle, run the MSIs directly)
        shell: pwsh
        run: |
          if (Get-Command swift -ErrorAction SilentlyContinue) {
            swift --version; Write-Host "swift already present"; exit 0
          }
          Write-Host "setup-swift has no Windows support (src throws 'Windows is not supported yet') — extracting the swift.org bundle"
          $url = "https://download.swift.org/swift-6.1.2-release/windows10/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-windows10.exe"
          Invoke-WebRequest $url -OutFile swift-installer.exe
          $sz = (Get-Item swift-installer.exe).Length
          Write-Host "bundle size: $sz bytes"
          if ($sz -lt 100MB) { throw "download too small" }

          # 7-Zip understands WiX burn containers — the MSIs inside are
          # installed directly with msiexec (the bundle exe itself exits 0
          # without doing anything on these runners — no log, no children)
          & 7z x swift-installer.exe -oextracted -y | Select-Object -Last 6
          $msis = Get-ChildItem extracted -Recurse -Filter *.msi | Sort-Object Length -Descending
          $msis | ForEach-Object { Write-Host "msi: $($_.FullName) ($($_.Length) bytes)" }
          if (-not $msis) {
            Get-ChildItem extracted -Recurse | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "no MSIs found in the bundle"
          }
          $i = 0
          foreach ($msi in $msis) {
            $i++
            Write-Host "installing MSI $i/$($msis.Count): $($msi.Name)"
            $p = Start-Process msiexec.exe -ArgumentList "/i","`"$($msi.FullName)`"","/qn","/norestart","/L*v","`"$env:RUNNER_TEMP\msi$i.log`"" -Wait -PassThru
            Write-Host "msiexec exit: $($p.ExitCode)"
          }
          Get-ChildItem "$env:RUNNER_TEMP" -Filter "msi*.log" | ForEach-Object { Get-Content $_.FullName -Tail 15 }

          # poll for the toolchain (msiexec may detach)
          $deadline = (Get-Date).AddMinutes(6)
          $found = $null
          while ((Get-Date) -lt $deadline) {
            $found = Get-ChildItem "C:\Program Files\Swift" -Recurse -Filter "swift.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "usr\\bin" } | Select-Object -First 1
            if ($found) { break }
            Write-Host "waiting for install..."
            Start-Sleep -Seconds 15
          }
          if ($found) { Write-Host "toolchain ready: $($found.FullName)" }
          else { throw "swift.exe never appeared" }

      - name: Locate Swift and add to PATH
        shell: pwsh
        run: |
          if (Get-Command swift -ErrorAction SilentlyContinue) { swift --version; exit 0 }
          $roots = @(
            "C:\Program Files\Swift\Toolchains",
            "C:\Library\Developer\Toolchains",
            "C:\Library\Swift"
          )
          $chain = $null
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $chain = Get-ChildItem $r -Directory | Select-Object -First 1
              if ($chain) { Write-Host "toolchain at: $($chain.FullName)"; break }
            }
          }
          if (-not $chain) {
            # last resort: search the whole program files
            $hit = Get-ChildItem "C:\Program Files" -Recurse -Filter "swift.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($hit) { $bin = Split-Path $hit.FullName }
          } else {
            $bin = Join-Path $chain.FullName "usr\bin"
          }
          if (-not $bin -or -not (Test-Path (Join-Path $bin "swift.exe"))) {
            throw "swift.exe not found anywhere"
          }
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\swift.exe" --version

      - name: Build + test (VS dev environment)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\vsdevcmd.bat" -arch=x64
          cd cross-platform
          swift build -c release
          swift test

      - name: Generate fixtures + parity scan
        shell: pwsh
        run: |
          python ci/make_fixtures.py "$env:RUNNER_TEMP\fixture" --scale 0.25
          cross-platform\.build\release\diskdude-cli.exe "$env:RUNNER_TEMP\fixture" --top 10 --out report-windows.txt
          Get-Content report-windows.txt | Select-Object -First 30

      - name: Normalize report (root path -> ROOT)
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\fixture"
          $r = [System.IO.File]::ReadAllText("report-windows.txt")
          $r = $r.Replace($root, "ROOT").Replace("$env:RUNNER_TEMP/fixture", "ROOT")
          [System.IO.File]::WriteAllText("report-windows.txt", $r)

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-windows
          path: report-windows.txt

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: diskdude-cli-windows
          path: cross-platform/.build/release/diskdude-cli.exe

  linux:
    name: "Linux: build + test + reference report"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: |
          cd cross-platform
          swift build -c release
          swift test
      - name: Fixtures + scan
        run: |
          python3 ci/make_fixtures.py "$RUNNER_TEMP/fixture" --scale 0.25
          cross-platform/.build/release/diskdude-cli "$RUNNER_TEMP/fixture" --top 10 --out report-linux.txt
          head -30 report-linux.txt
      - name: Normalize report (root path -> ROOT)
        shell: bash
        run: |
          sed -i.bak "s|$RUNNER_TEMP/fixture|ROOT|g" report-linux.txt && rm -f report-linux.txt.bak
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report-linux
          path: report-linux.txt

  macos:
    name: "macOS: build + test + report (SwiftPM, no Xcode UI)"
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build + test
        run: |
          cd cross-platform
          swift build -c release
          swift test
      - name: Fixtures + scan
        run: |
          python3 ci/make_fixtures.py "$RUNNER_TEMP/fixture" --scale 0.25
          cross-platform/.build/release/diskdude-cli "$RUNNER_TEMP/fixture" --top 10 --out report-macos.txt
          head -30 report-macos.txt
      - name: Normalize report (root path -> ROOT)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import os, pathlib
          t = os.environ["RUNNER_TEMP"] + "/fixture"
          p = pathlib.Path("report-macos.txt")
          s = p.read_text()
          p.write_text(s.replace(t, "ROOT"))
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report-macos
          path: report-macos.txt

  parity:
    name: "Parity: byte-identical reports across Windows/Linux/macOS"
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-report-*
          merge-multiple: false
          path: reports/
      - name: Diff the three reports
        run: |
          find reports -name "*.txt" | sort
          ok=1
          for a in reports/*/report-*.txt; do
            for b in reports/*/report-*.txt; do
              if [ "$a" \< "$b" ]; then
                if ! diff -u "$a" "$b"; then
                  echo "MISMATCH: $a vs $b"
                  ok=0
                fi
              fi
            done
          done
          if [ $ok -eq 1 ]; then
            echo "✓ All three platforms produced byte-identical scan reports"
          else
            exit 1
          fi
