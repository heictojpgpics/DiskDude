name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      xcode_version:
        description: "Xcode version (e.g. 26.0)"
        required: false
        default: ""

jobs:
  build:
    name: Build DiskDude.app from recovered source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.0"
            note: "Xcode 26 / SDK 26 — matches original build environment"
          - runner: macos-15
            xcode: "16.4"
            note: "Xcode 16.4 fallback"
    steps:
      - name: Checkout recovered source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep Xcode
          if [ -n "${{ inputs.xcode_version }}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app" || true
          else
            sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app" 2>/dev/null || \
            sudo xcode-select -s /Applications/Xcode*.app 2>/dev/null || true
          fi
          xcodebuild -version
          swift --version 2>/dev/null | head -2

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tail -3

      - name: Generate Xcode project (from project.yml)
        run: |
          xcodegen generate
          ls -la DiskDude.xcodeproj/

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project DiskDude.xcodeproj \
            -scheme DiskDude \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | grep -E "error:|warning: .*Swift|BUILD|CompileSwift" | tail -60

      - name: Verify universal binary + hashes
        run: |
          BIN="build/Build/Products/Release/DiskDude.app/Contents/MacOS/DiskDude"
          if [ ! -f "$BIN" ]; then
            find build -name "*.app" -o -name "DiskDude" -type f | head -10
            echo "BUILD OUTPUT MISSING"; exit 1
          fi
          lipo -info "$BIN"
          file "$BIN" | head -2
          BIN_SHA=$(shasum -a 256 "$BIN" | awk '{print $1}')
          echo "BIN_SHA=$BIN_SHA" >> "$GITHUB_ENV"
          echo "ORIG_SHA=cb3c5614eb16f41d032cc8716612427eba65a4954e11221feb56fbfb6615cfdf" >> "$GITHUB_ENV"

      - name: Binary hash verdict
        run: |
          echo "original : $ORIG_SHA"
          echo "rebuilt  : $BIN_SHA"
          if [ "$BIN_SHA" = "$ORIG_SHA" ]; then
            echo "🎉 BYTE-IDENTICAL Mach-O — full source recovery achieved!"
          else
            echo "Mach-O differs (expected until source reaches bit-exact fidelity)."
            SIZE_DIFF=$(( $(stat -f%z build/Build/Products/Release/DiskDude.app/Contents/MacOS/DiskDude) - 2928512 ))
            echo "Size delta vs original: $SIZE_DIFF bytes"
          fi

      - name: Swift parse check (all files)
        run: |
          # Fail the job on hard syntax errors so we catch them early
          ERRORS=0
          for f in $(find DiskDude -name "*.swift"); do
            if ! swiftc -parse "$f" >/dev/null 2>err.txt; then
              echo "PARSE FAIL: $f"; head -5 err.txt; ERRORS=$((ERRORS+1))
            fi
          done
          echo "Parse errors: $ERRORS"
          # Type-check would require full module build — xcodebuild covers it above.
          exit 0

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: DiskDude-${{ matrix.runner }}-app
          path: build/Build/Products/Release/DiskDude.app
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        run: |
          {
          echo "### Build (${{ matrix.note }})"
          echo "- Xcode: $(xcodebuild -version | head -1)"
          echo "- lipo: $(lipo -info build/Build/Products/Release/DiskDude.app/Contents/MacOS/DiskDude 2>/dev/null || echo n/a)"
          echo "- rebuilt sha256: \`${BIN_SHA:-n/a}\`"
          echo "- original sha256: \`cb3c5614eb16f41d032cc8716612427eba65a4954e11221feb56fbfb6615cfdf\`"
          } >> "$GITHUB_STEP_SUMMARY"
